<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>디자인 토큰 확인 (개발용)</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <h1>디자인 토큰 확인 (개발용)</h1>
  </header>
  <main class="page stack">
    <section class="stack" aria-labelledby="h-status">
      <h2 id="h-status">상태 배지</h2>
      <div class="row">
        <span class="badge badge--status-todo">할 일</span>
        <span class="badge badge--status-in_progress">진행 중</span>
        <span class="badge badge--status-done">완료</span>
      </div>
    </section>

    <section class="stack" aria-labelledby="h-priority">
      <h2 id="h-priority">우선순위 배지</h2>
      <div class="row">
        <span class="badge badge--priority-high">높음</span>
        <span class="badge badge--priority-medium">보통</span>
        <span class="badge badge--priority-low">낮음</span>
      </div>
    </section>

    <section class="stack" aria-labelledby="h-urgent">
      <h2 id="h-urgent">긴급 배지</h2>
      <div class="row">
        <span class="badge badge--urgent-soon">D-3</span>
        <span class="badge badge--urgent-soon">D-day</span>
        <span class="badge badge--urgent-overdue">D+2</span>
      </div>
    </section>

    <section class="stack" aria-labelledby="h-btn">
      <h2 id="h-btn">버튼</h2>
      <div class="row">
        <button type="button" class="btn btn--primary">새 할일</button>
        <button type="button" class="btn btn--secondary">취소</button>
        <button type="button" class="btn btn--primary" disabled>비활성</button>
      </div>
    </section>

    <section class="stack" aria-labelledby="h-card">
      <h2 id="h-card">카드와 입력</h2>
      <article class="card stack">
        <div class="row">
          <span class="badge badge--priority-high">높음</span>
          <span class="badge badge--status-in_progress">진행 중</span>
          <span class="badge badge--urgent-overdue">D+2</span>
        </div>
        <h3>분기 업무 계획서 작성</h3>
        <p>담당자: 김민준 · 마감일: 2026-10-05</p>
        <div class="field">
          <label class="field__label" for="sample-title">제목 (필수)</label>
          <input class="field__input" id="sample-title" type="text" value="입력 예시" aria-describedby="sample-title-err">
          <p class="field__error" id="sample-title-err">오류 메시지는 이렇게 입력과 연결합니다</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
